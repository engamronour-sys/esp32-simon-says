<line x1="550" y1="128" x2="720" y2="128" class="ln"/>
<text x="391" y="158" class="lbl">LED · middle</text>
<text x="510" y="158" class="lbl">330 Ω</text>
<text x="222" y="190" class="pin">GPIO27</text>
<circle cx="720" cy="186" r="3.5" class="fill"/>
<line x1="230" y1="186" x2="380" y2="186" class="ln"/>
<polygon points="380,174 380,198 402,186" class="ln"/>
<line x1="402" y1="174" x2="402" y2="198" class="ln"/>
<line x1="390" y1="171" x2="398" y2="161" class="ln" stroke-width="1.5"/>
<polygon points="398,161 392,162 397,167" class="fill"/>
<line x1="398" y1="171" x2="406" y2="161" class="ln" stroke-width="1.5"/>
<polygon points="406,161 400,162 405,167" class="fill"/>
<line x1="402" y1="186" x2="470" y2="186" class="ln"/>
