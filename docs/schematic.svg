<line x1="716" y1="516" x2="724" y2="516" class="ln"/>
<text x="730" y="60" class="lbl" text-anchor="start" style="text-anchor:start">GND</text>
<text x="222" y="74" class="pin">GPIO25</text>
<line x1="230" y1="70" x2="380" y2="70" class="ln"/>
<polygon points="380,58 380,82 402,70" class="ln"/>
<line x1="402" y1="58" x2="402" y2="82" class="ln"/>
<line x1="390" y1="55" x2="398" y2="45" class="ln" stroke-width="1.5"/>
<polygon points="398,45 392,46 397,51" class="fill"/>
<line x1="398" y1="55" x2="406" y2="45" class="ln" stroke-width="1.5"/>
<polygon points="406,45 400,46 405,51" class="fill"/>
<line x1="402" y1="70" x2="470" y2="70" class="ln"/>
<path d="M470,70 l5,-8 l10,16 l10,-16 l10,16 l10,-16 l10,16 l10,-16 l10,16 l5,-8" class="ln"/>
<line x1="550" y1="70" x2="720" y2="70" class="ln"/>
<text x="391" y="100" class="lbl">LED · right</text>
<text x="510" y="100" class="lbl">330 Ω</text>
<text x="222" y="132" class="pin">GPIO26</text>
<circle cx="720" cy="128" r="3.5" class="fill"/>
<line x1="230" y1="128" x2="380" y2="128" class="ln"/>
<polygon points="380,116 380,140 402,128" class="ln"/>
<line x1="402" y1="116" x2="402" y2="140" class="ln"/>
