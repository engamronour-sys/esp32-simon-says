<line x1="550" y1="186" x2="720" y2="186" class="ln"/>
<text x="391" y="216" class="lbl">LED · left</text>
<text x="510" y="216" class="lbl">330 Ω</text>
<text x="222" y="248" class="pin">GPIO32</text>
<circle cx="720" cy="244" r="3.5" class="fill"/>
<line x1="230" y1="244" x2="440.5" y2="244" class="ln"/>
<circle cx="444" cy="244" r="3.5" fill="#FFFFFF" class="ln"/>
<circle cx="496" cy="244" r="3.5" fill="#FFFFFF" class="ln"/>
<line x1="438" y1="232" x2="502" y2="232" class="ln"/>
<line x1="470" y1="232" x2="470" y2="220" class="ln"/>
<line x1="461" y1="220" x2="479" y2="220" class="ln"/>
<line x1="499.5" y1="244" x2="720" y2="244" class="ln"/>
<text x="470" y="270" class="lbl">Button · right</text>
<text x="222" y="306" class="pin">GPIO33</text>
<circle cx="720" cy="302" r="3.5" class="fill"/>
<line x1="230" y1="302" x2="440.5" y2="302" class="ln"/>
<circle cx="444" cy="302" r="3.5" fill="#FFFFFF" class="ln"/>
<circle cx="496" cy="302" r="3.5" fill="#FFFFFF" class="ln"/>
<line x1="438" y1="290" x2="502" y2="290" class="ln"/>
<line x1="470" y1="290" x2="470" y2="278" class="ln"/>
<line x1="461" y1="278" x2="479" y2="278" class="ln"/>
<line x1="499.5" y1="302" x2="720" y2="302" class="ln"/>
<text x="470" y="328" class="lbl">Button · middle</text>
<text x="222" y="364" class="pin">GPIO14</text>
<circle cx="720" cy="360" r="3.5" class="fill"/>
<line x1="230" y1="360" x2="440.5" y2="360" class="ln"/>
<circle cx="444" cy="360" r="3.5" fill="#FFFFFF" class="ln"/>
<circle cx="496" cy="360" r="3.5" fill="#FFFFFF" class="ln"/>
<line x1="438" y1="348" x2="502" y2="348" class="ln"/>
<line x1="470" y1="348" x2="470" y2="336" class="ln"/>
<line x1="461" y1="336" x2="479" y2="336" class="ln"/>
<line x1="499.5" y1="360" x2="720" y2="360" class="ln"/>
