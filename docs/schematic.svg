<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600" width="780" height="600" role="img" aria-labelledby="t d">
<title id="t">ESP32 Simon Says schematic</title>
<desc id="d">GPIO25, 26 and 27 each drive an LED through a 330 ohm resistor to ground. GPIO32, 33 and 14 each go through a push button to ground. GPIO13 drives the buzzer plus pin; the buzzer minus pin goes to ground.</desc>
<style>
.ln{stroke:#24292F;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fill{fill:#24292F}
.lbl{font-family:Helvetica,Arial,sans-serif;font-size:13px;fill:#24292F;text-anchor:middle}
.pin{font-family:Menlo,Consolas,monospace;font-size:13px;fill:#24292F;text-anchor:end}
.chip{font-family:Helvetica,Arial,sans-serif;fill:#24292F}
.note{font-family:Helvetica,Arial,sans-serif;font-size:13px;fill:#57606A}
</style>
<rect width="780" height="600" fill="#FFFFFF"/>
<rect x="30" y="40" width="200" height="466" rx="6" class="ln"/>
<text x="46" y="66" class="chip" font-size="18" font-weight="700">ESP32</text>
<text x="46" y="84" class="chip" font-size="12">DevKitC V4</text>
<text x="46" y="100" class="chip" font-size="12">WROOM-32D</text>
<line x1="720" y1="70" x2="720" y2="502" class="ln"/>
<line x1="704" y1="502" x2="736" y2="502" class="ln"/>
