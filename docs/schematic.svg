<text x="222" y="422" class="pin">GPIO13</text>
<circle cx="720" cy="418" r="3.5" class="fill"/>
<line x1="230" y1="418" x2="452" y2="418" class="ln"/>
<rect x="452" y="405" width="36" height="26" rx="3" fill="#FFFFFF" class="ln"/>
<text x="470" y="423" class="lbl" font-size="12" font-weight="700">BZ</text>
<text x="444" y="410" class="lbl" font-weight="700">+</text>
<line x1="488" y1="418" x2="720" y2="418" class="ln"/>
<text x="470" y="450" class="lbl">Buzzer</text>
<text x="222" y="480" class="pin">GND</text>
<circle cx="720" cy="476" r="3.5" class="fill"/>
<line x1="230" y1="476" x2="720" y2="476" class="ln"/>
<text x="30" y="556" class="note">Buttons use the ESP32's internal pull-ups (INPUT_PULLUP): released = HIGH, pressed = LOW.</text>
<text x="30" y="576" class="note">Each LED sits next to its button: 25 + 32 (right), 26 + 33 (middle), 27 + 14 (left).</text>
</svg>
